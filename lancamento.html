            <div class="tabela__container"> 
                <table>
                    <tr>

                                <input type="checkbox" class="checkbox"/>
                                <div class="tabela__info__texto">

                            </div>
                        </td>

                                <strong>Ford Ranger Storm 3.2 Diesel 4x4 AT- 2022</strong>
                                <p class="preco">Preço: R$ 183.000,00</p>

                            </div>
