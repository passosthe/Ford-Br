<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="./styles/principal.css">
    <link rel="stylesheet" href="styles/contato.css">
</head>
<body>
    <header >
        <nav>
            <ul class="nav__lista">

                <li class="nav__item">
                    <a href="index.html">
                    <img class="logo-principal" src="./assets/img/logo-ford-256.png" alt="logo da ford">
                    </a>
                </li>

                <li class="nav__item">
                    <a href="index.html" class="nav__link" >HOME</a>
                </li>

                <li class="nav__item">
                    <a href="lancamento.html" class="nav__link" >LANÇAMENTO</a>
                </li>

                <li class="nav__item">
                    <a href="./contato.html" class="nav__link" >CONTATO</a>
                </li>

                <li class="nav__item nav__item__form">
                    <form class="nav__form">
                        <input type="search" id="pesquisar" class="nav__input" placeholder="Pesquisar">
                    </form>
                </li>
            </ul>
        </nav>  
    </header>
    
    <main>
        <div class="formulario"> 
            <div class="campo">
                <img src="assets/img/xls 2.2 diesel.jpg" alt="foto da ford ranger xls" class="imagem">
            </div>

            <div class="caixa__titulo">
                <h1 class="titulo">Fale conosco</h1>
                <p class="subtitulo">Para enviar sua solicitação, dúvida, sugestão ou elogios, por favor, preencha os campos abaixo:</p>
                
                
                <form action="" method="get"">
                    <div class="campo">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="Nome" placeholder="Escreva aqui" required>
                    </div>
                    
                    <div class="campo">
                        <label for="email">E-mail:</label> 
                        <input type="email" id="email" name="email" placeholder="Escreva aqui" required>
                    </div>
                    
                    <div class="campo"> 
                        <label for="celular">Celular:</label> 
                        <input type="tel" id="celular" name="celular" placeholder="Escreva aqui" required>
                    </div>
                    
                    <div class="campo"> 
                        <label for="assunto">Assunto:</label>
                        <select id="assunto" name="assunto" required>
                            <option selected disabled value="">Selecione</option>
                            <option value="sugestao">Sugestão</option>
                            <option value="duvida">Dúvida</option>
                            <option value="reclamacao">Reclamação</option>
                            <option value="elogio">Elogio</option>
                        </select>
                    </div>
                    
                    <div class="campo"> 
                        <label for="mensagem">Mensagem:</label>
                        <textarea row="6" style="height: 10em;" id="mensagem" name="mensagem" placeholder="Escreva sua mensagem..." required></textarea>
                    </div>
                    
                    <button type="submit" class="botao botao__form">Enviar</button>
                </form>
            </div>
        </div>
        
    </main>

    <footer class="rodape">
        <div class="rodape__container">
            <h2 class="rodape__titulo">Redes Sociais</h2>

            <nav class="rodape__links">
                <a href="https://www.facebook.com/FordBrasil/" >
                <img class="logo" src="assets/img/facebook-50.png" alt="facebook">
                </a>
                
                <a href="https://www.youtube.com/user/fordbrasil" >
                <img class="logo" src="assets/img/youtube-squared-50.png" alt="youtube">
                </a>
                
                <a href="https://www.instagram.com/fordbrasil/" >
                <img class="logo" src="assets/img/instagram-logo-50.png" alt="instagram">
                </a>
                
                <a href="https://www.linkedin.com/company/ford-brasil/" >
                <img class="logo icon" src="assets/img/linkedin (5).png" alt="linkedin">
                </a>
               
                <a href="https://www.tiktok.com/@fordbrasil" >
                <img class="logo icon" src="assets/img/tiktok (1).png" alt="tiktok">
                </a>
            </nav>
        
            <p class="copyright">&copy; 2025 Ford - Todos os direitos reservados</p>
            <img class="rodape__logo" src="assets/img/ford-96.png" alt="logo ford">
        </div>
    </footer>

</body>
</html>
